trigger:
  branches:
    include:
      - master
      - release/*
# Uncomment to run the pipeline for PRs from any branch.
# Also set allowNonMasterDeploy to true below, or non-master builds fail at "Validate Source Branch".
# pr:
#   branches:
#     include:
#       - '*'

resources:
  repositories:
    - repository: templates
      type: git
      name: Shared-Project/Pipeline-Templates
      ref: refs/heads/main
      endpoint: Pipeline-Templates-Connection

variables:
  - name: sourceBranchShort
    value: $(Build.SourceBranchName)
  - name: sourceVersionMessage
    value: $(Build.SourceVersionMessage)
stages:

- template: master-deploy.yml@templates
  parameters:
    techStack: 'python'
    appName: 'market-data-func'
    resourceGroupName: 'rg-marketdata-dev-eastus'
    sourceBranch: '$(Build.SourceBranch)'
    sourceBranchShort: '$(sourceBranchShort)'
    sourceVersionMessage: '$(sourceVersionMessage)'
    allowNonMasterDeploy: false
    installAzureDataToolkit: true
    publishAzureArtifacts: false