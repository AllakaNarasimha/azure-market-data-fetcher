trigger:
  branches:
    include:
      - master
      

resources:
  repositories:
    - repository: templates
      type: git
      name: Pipeline-Templates/Pipeline-Templates  
      ref: refs/heads/main

stages:
  - template: master-deploy.yml@templates
    parameters:
      techStack: 'python'                                   
      appName: 'marketdata-func-0916-narasimha'              
      environmentName: 'Development'
      azureServiceConnection: 'MyAzureConnection'
      sourceBranch: '$(Build.SourceBranch)'
      sourceVersionMessage: '$(Build.SourceVersionMessage)'
      allowNonMasterDeploy: true