trigger:
  branches:
    include:
      - master
      - main

# 1. Link your centralized Azure Repo containing the templates
resources:
  repositories:
    - repository: templates
      type: git
      name: nimalantech/Pipeline-Templates  # Format: YourAzureOrg/YourTemplateRepo

stages:
  # 2. Call the centralized orchestrator template from the other repo
  - template: master-deploy.yml@templates
    parameters:
      techStack: 'python'                                   # Your app's tech stack
      appName: 'marketdata-func-0916-narasimha'               # Your exact Azure App/Function name
      environmentName: 'Development'
      azureServiceConnection: 'Azure subscription 1'        # Verified against az account show
      resourceGroup: 'rg-marketdata-dev-eastus'
      pythonVersion: '3.11'