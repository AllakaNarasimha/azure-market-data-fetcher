trigger:
  branches:
    include:
      - master

# 1. Link your centralized Azure Repo containing the templates
resources:
  repositories:
    - repository: templates
      type: git
      name: Pipeline-Templates/Pipeline-Templates  # Must match your ProjectName/RepoName
      ref: refs/heads/main

stages:
  # 2. Call the centralized orchestrator template from the other repo
  - template: master-deploy.yml@templates
    parameters:
      techStack: 'python'                                   # Your app's tech stack
      appName: 'marketdata-func-0916-narasimha'               # Your exact Azure Function App name
      environmentName: 'Development'
      azureServiceConnection: 'MyAzureConnection'           # Explicitly passing your service connection name